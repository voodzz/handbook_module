<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список клубов</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .student-header { background: #fff3cd; padding: 10px; border: 1px solid #ffeeba; margin-bottom: 20px; }
        .actions a { margin-right: 10px; text-decoration: none; }
        .btn-add { background: #28a745; color: white; padding: 10px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="student-header">
    <p th:text="${studentInfo}">Данные студента</p>
</div>

<h1>Справочник: Футбольные клубы</h1>

<div style="margin-bottom: 20px;">
    <a href="/" style="text-decoration: none;">🏠 На главную</a> |
    <a href="/clubs/add" class="btn-add">+ Добавить новый клуб</a>
</div>

<table>
    <thead>
    <tr>
        <th><a th:href="@{/clubs(sortBy='name')}">Название клуба</a></th>
        <th><a th:href="@{/clubs(sortBy='creationDate')}">Дата основания</a></th>
        <th><a th:href="@{/clubs(sortBy='stadiumName')}">Стадион</a></th>
        <th><a th:href="@{/clubs(sortBy='uefaRating')}">Рейтинг UEFA</a></th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="club : ${clubs}">
        <td th:text="${club.name}"></td>
        <td th:text="${#temporals.format(club.creationDate, 'dd.MM.yyyy')}"></td>
        <td th:text="${club.stadiumName}"></td>
        <td th:text="${#numbers.formatDecimal(club.uefaRating, 1, 3)}"></td>
        <td class="actions">
            <a th:href="@{/clubs/edit/{id}(id=${club.id})}" style="color: blue;">📝</a>
            <a th:href="@{/clubs/delete/{id}(id=${club.id})}"
               style="color: red;"
               onclick="return confirm('Вы уверены? Это обнулит клуб у связанных игроков.')">🗑️</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
