<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список футболистов</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .student-info { background: #e7f3ff; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .btn { padding: 5px 10px; text-decoration: none; border: 1px solid #000; color: #000; }
    </style>
</head>
<body>

<div class="student-info">
    <h2 th:text="${studentInfo}">Инфо о студенте</h2>
</div>

<h1>Справочник: Футболисты</h1>

<a href="/players/add" class="btn" style="background: #d4edda;">+ Добавить игрока</a>

<table>
    <thead>
    <tr>
        <th><a th:href="@{/players(sortBy='firstName')}">Имя</a></th>
        <th><a th:href="@{/players(sortBy='lastName')}">Фамилия</a></th>
        <th><a th:href="@{/players(sortBy='birthDate')}">Дата рождения</a></th>
        <th><a th:href="@{/players(sortBy='club')}">Клуб</a></th>
        <th><a th:href="@{/players(sortBy='height')}">Рост (м)</a></th>
        <th><a th:href="@{/players(sortBy='marketValue')}">Цена (€)</a></th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${players}">
        <td th:text="${p.firstName}"></td>
        <td th:text="${p.lastName}"></td>
        <td th:text="${#temporals.format(p.birthDate, 'dd.MM.yyyy')}"></td>
        <td th:text="${p.club?.name ?: 'Свободный агент'}"></td>
        <td th:text="${p.height}"></td>
        <td th:text="${#numbers.formatDecimal(p.marketValue, 0, 'WHITESPACE', 0, 'POINT')}"></td>
        <td>
            <a th:href="@{/players/delete/{id}(id=${p.id})}"
               onclick="return confirm('Удалить игрока?')"
               style="color: red;">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
