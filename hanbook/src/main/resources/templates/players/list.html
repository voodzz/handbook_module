<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список футболистов</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .student-header { background: #e7f3ff; padding: 10px; border: 1px solid #b8daff; margin-bottom: 20px; }
        .btn-add { background: #28a745; color: white; padding: 10px; text-decoration: none; border-radius: 4px; }
        .notes-cell { font-style: italic; color: #666; font-size: 0.9em; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div class="student-header">
    <h3 th:text="${studentInfo}">Данные студента</h3>
</div>

<h1>Справочник: Футболисты</h1>

<div style="margin-bottom: 20px;">
    <a href="/" style="text-decoration: none;">🏠 На главную</a> |
    <a href="/players/add" class="btn-add">+ Добавить игрока</a>
</div>

<table>
    <thead>
    <tr>
        <th><a th:href="@{/players(sortBy='firstName')}">Имя</a></th>
        <th><a th:href="@{/players(sortBy='lastName')}">Фамилия</a></th>
        <th><a th:href="@{/players(sortBy='birthDate')}">Дата рождения</a></th>
        <th><a th:href="@{/players(sortBy='club')}">Клуб</a></th>
        <th><a th:href="@{/players(sortBy='height')}">Рост</a></th>
        <th><a th:href="@{/players(sortBy='marketValue')}">Стоимость</a></th>
        <th>Заметки</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${players}">
        <td th:text="${p.firstName}"></td>
        <td th:text="${p.lastName}"></td>
        <td th:text="${#temporals.format(p.birthDate, 'dd.MM.yyyy')}"></td>
        <td th:text="${p.club?.name ?: 'Свободный агент'}"></td>
        <td th:text="${p.height + ' м'}"></td>
        <td th:text="${p.marketValue + ' €'}"></td>
        <td class="notes-cell" th:text="${p.notes}" th:title="${p.notes}"></td>
        <td>
            <a th:href="@{/players/edit/{id}(id=${p.id})}" style="color: blue; text-decoration: none;">📝</a>
            <a th:href="@{/players/delete/{id}(id=${p.id})}"
               style="color: red; text-decoration: none; margin-left: 10px;"
               onclick="return confirm('Удалить игрока?')">🗑️</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
