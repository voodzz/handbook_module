<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование игрока</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 350px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-save { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; }
        .btn-back { color: #666; text-decoration: none; margin-left: 15px; }
        textarea { resize: vertical; min-height: 80px; }
    </style>
</head>
<body>

<h1 th:text="${player.id == null ? 'Добавить футболиста' : 'Редактировать футболиста'}">Форма</h1>

<form th:action="@{/players/save}" th:object="${player}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label>Имя:</label>
        <input type="text" th:field="*{firstName}" required />
    </div>

    <div class="form-group">
        <label>Фамилия:</label>
        <input type="text" th:field="*{lastName}" required />
    </div>

    <div class="form-group">
        <label>Дата рождения:</label>
        <input type="date"
               id="birthDate"
               name="birthDate"
               th:value="${player.birthDate != null ? #temporals.format(player.birthDate, 'yyyy-MM-dd') : ''}"
               required />
    </div>

    <div class="form-group">
        <label>Клуб:</label>
        <select th:field="*{club}">
            <option value="">-- Выберите клуб (Свободный агент) --</option>
            <option th:each="c : ${clubs}"
                    th:value="${c.id}"
                    th:text="${c.name}"></option>
        </select>
    </div>

    <div class="form-group">
        <label>Рост (м):</label>
        <input type="number" step="0.01" th:field="*{height}" />
    </div>

    <div class="form-group">
        <label>Рыночная стоимость (€):</label>
        <input type="number" th:field="*{marketValue}" />
    </div>

    <div class="form-group">
        <label>Заметки (многострочное поле):</label>
        <textarea th:field="*{notes}"></textarea>
    </div>

    <div style="margin-top: 25px;">
        <button type="submit" class="btn-save">💾 Сохранить</button>
        <a href="/players" class="btn-back">Отмена</a>
    </div>
</form>

</body>
</html>
